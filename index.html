    // --- Live Tracking Logic ---
    function toggleLiveTracking(viewName) {
        if (!cvReady) {
            alert("Auto-Fit AI is still loading. Please wait a moment.");
            return;
        }
        const ov = overlays[viewName];
        if (ov.type !== 'camera') {
            // Fallback for static image: just align once
            autoAlign(viewName, false);
            return;
        }
        
        trackingState[viewName].active = !trackingState[viewName].active;
        const btn = document.querySelector(`#container-${viewName} button[title="Auto-Fit to Diamond"]`);
        
        if (trackingState[viewName].active) {
            btn.style.backgroundColor = '#10b981'; // Green to indicate active
            runTrackingLoop(viewName);
        } else {
            btn.style.backgroundColor = '';
        }
    }

    function runTrackingLoop(viewName) {
        if (!trackingState[viewName].active) return;
        if (overlays[viewName].type !== 'camera') {
            toggleLiveTracking(viewName); // Stop if camera stopped
            return;
        }

        // Run detection logic in "live" mode with safety
        try {
            autoAlign(viewName, true);
        } catch (e) {
            console.warn("Tracking error:", e);
        }
        
        requestAnimationFrame(() => runTrackingLoop(viewName));
    }

    // Reusable canvas for detection to prevent GC stutter
    const detectCanvas = document.createElement('canvas');
    const detectCtx = detectCanvas.getContext('2d', { willReadFrequently: true });

    // --- Auto-Alignment & Detection ---
    function autoAlign(viewName, isLive = false) {
        if (!cvReady) return;

        const ov = overlays[viewName];
        const canvas = (viewName === 'profile') ? cvsProfile : cvsPlan;
        const width = canvas.width;
        const height = canvas.height;
        const ist = imageState[viewName];
        
        // Scale for detection performance (OpenCV handles scaling well, max 400px is good for fast accurate results)
        const scale = Math.min(1, 400 / Math.max(width, height));
        const dw = Math.floor(width * scale);
        const dh = Math.floor(height * scale);

        detectCanvas.width = dw;
        detectCanvas.height = dh;
        
        // Correctly scale the Translation component of Image State for the downsized canvas
        const scaledIst = {
            x: ist.x * scale,
            y: ist.y * scale,
            scale: ist.scale,
            rotate: ist.rotate
        };

        // 1. Render scaled image
        if (ov.type === 'camera' && ov.elVid.style.display !== 'none') {
            // Capture current video frame
            drawTransformedImage(detectCtx, ov.elVid, scaledIst, dw, dh);

            if (!isLive) {
                // Normal freeze behavior: Cache as image reference
                ov.elImg.src = detectCanvas.toDataURL();
                
                // Stop camera stream cleanly
                toggleCamera(viewName); 
                
                // Switch UI to Image mode
                ov.type = 'image';
                ov.elImg.style.display = 'block';
            }
        } else if (ov.type === 'image' && ov.elImg.src) {
            // Use existing image
            drawTransformedImage(detectCtx, ov.elImg, scaledIst, dw, dh);
        } else {
            if (!isLive) alert("Please start the camera or upload an image to use Auto-Fit.");
            return;
        }

        // 2. OpenCV Detection Pipeline
        let src = null;
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let edges = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        try {
            const imgData = detectCtx.getImageData(0, 0, dw, dh);
            src = cv.matFromImageData(imgData);
            
            // Grayscale
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
            
            // Blur for noise reduction
            cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0);
            
            // Canny edge detection
            cv.Canny(blurred, edges, 40, 120, 3, false);
            
            // Dilation to combine broken edges across facets
            let M = cv.Mat.ones(3, 3, cv.CV_8U);
            cv.dilate(edges, edges, M, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());
            M.delete();

            // Find Contours
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            let maxArea = 0;
            let bestIdx = -1;
            
            // Temporal tracking initialization
            if (!trackingState[viewName].lastPos) {
                trackingState[viewName].lastPos = {x: dw/2, y: dh/2, confidence: 0};
            }
            let lastP = trackingState[viewName].lastPos;

            // Only consider contours that match the expected shapes (Circle for Plan, Polygon for Profile)
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt, false);
                
                if (area < 100) { 
                    cnt.delete();
                    continue; 
                }

                let rect = cv.boundingRect(cnt);
                let cx = rect.x + rect.width / 2;
                let cy = rect.y + rect.height / 2;
                
                // If we have a good lock from prior frames, strongly penalize teleporting outside a search radius
                let distSq = Math.pow(cx - dw/2, 2) + Math.pow(cy - dh/2, 2);
                let maxDistSq = (dw*dw + dh*dh) / 4;
                let weight = Math.max(0.01, 1 - (distSq / maxDistSq)); // Basic center weight
                
                if (lastP.confidence > 0.5 && isLive) {
                    let temporalDistSq = Math.pow(cx - lastP.x, 2) + Math.pow(cy - lastP.y, 2);
                    let lockRadiusSq = Math.pow(Math.max(dw,dh) * 0.35, 2); // 35% screen size radius
                    if (temporalDistSq > lockRadiusSq) {
                        // Too far from known good location, reject it to prevent teleportation
                        weight = 0; 
                    } else {
                        weight *= 2.0; // Boost weight for things near known location
                    }
                }

                if (weight === 0) {
                    cnt.delete();
                    continue;
                }

                let perimeter = cv.arcLength(cnt, true);
                let circularity = (perimeter === 0) ? 0 : (4 * Math.PI * area) / (perimeter * perimeter);
                let aspect = rect.width / rect.height;
                
                let score = 0;
                
                if (viewName === 'plan') {
                    // Plan view: Circularity check (perfect circle = 1.0, typical noisy diamond outline > 0.5)
                    if (circularity > 0.5) {
                        score = area * circularity * weight;
                    }
                } else {
                    // Profile view: Solidity & Aspect check
                    let hull = new cv.Mat();
                    cv.convexHull(cnt, hull, false, true);
                    let hullArea = cv.contourArea(hull, false);
                    let solidity = (hullArea === 0) ? 0 : area / hullArea;
                    hull.delete();
                    
                    // Diamond profile is typically convex and wider than tall, roughly aspect 1.2 to 3.5
                    if (aspect > 0.8 && aspect < 4.5 && solidity > 0.6) {
                        score = area * solidity * weight;
                    }
                }
                
                if (score > maxArea) {
                    maxArea = score;
                    bestIdx = i;
                }
                cnt.delete();
            }

            if (bestIdx !== -1) {
                let bestCnt = contours.get(bestIdx);
                let boxCX, boxCY, objectSize;

                if (viewName === 'plan') {
                    // Exact circular fit
                    let circle = cv.minEnclosingCircle(bestCnt);
                    boxCX = circle.center.x;
                    boxCY = circle.center.y;
                    objectSize = circle.radius * 2;
                } else {
                    // Bounding Box fit for profile
                    let rect = cv.boundingRect(bestCnt);
                    boxCX = rect.x + rect.width / 2;
                    boxCY = rect.y + rect.height / 2;
                    objectSize = Math.max(rect.width, rect.height);
                }
                bestCnt.delete();
                
                // Update tracking lock
                lastP.x = boxCX;
                lastP.y = boxCY;
                lastP.confidence = Math.min(1.0, lastP.confidence + 0.1);

                // Convert back from downscaled canvas coordinates
                boxCX /= scale;
                boxCY /= scale;
                objectSize /= scale;

                const minDim = Math.min(width, height);
                const baseDiameter = minDim * 0.8; 
                
                const targetX = boxCX - (width / 2);
                const targetY = boxCY - (height / 2);
                const targetScale = objectSize / baseDiameter;

                if (isLive) {
                    // Smoother interpolation (Lerp) for face-filter feel
                    const lerpSpeed = 0.25; 
                    
                    let dx = targetX - viewState[viewName].x;
                    let dy = targetY - viewState[viewName].y;
                    let dScale = targetScale - viewState[viewName].scale;
                    
                    if (Math.abs(dx) < 200 && Math.abs(dy) < 200) {
                        viewState[viewName].x += dx * lerpSpeed;
                        viewState[viewName].y += dy * lerpSpeed;
                        viewState[viewName].scale += dScale * lerpSpeed;
                    }
                } else {
                    // Instant snap for static alignment
                    viewState[viewName].x = targetX;
                    viewState[viewName].y = targetY;
                    viewState[viewName].scale = targetScale;
                }

                draw();
            } else {
                // Diminish tracking memory confidence if we fail to find the diamond this frame
                if (isLive && lastP) {
                    lastP.confidence = Math.max(0, lastP.confidence - 0.05);
                }
            }

        } catch (e) {
            console.error("OpenCV AutoAlign Error: ", e);
        } finally {
            // Memory Management
            if (src) src.delete();
            gray.delete();
            blurred.delete();
            edges.delete();
            contours.delete();
            hierarchy.delete();
        }
    }
    // --- Transformed Drawing Helper ---
    function drawTransformedImage(ctx, img, ist, w, h) {
        ctx.save();
        ctx.translate(w/2 + ist.x, h/2 + ist.y);
        ctx.rotate(ist.rotate);
        ctx.scale(ist.scale, ist.scale);
        ctx.translate(-w/2, -h/2);
        drawImageProp(ctx, img, 0, 0, w, h);
        ctx.restore();
    }
    // --- 3-Point Alignment Logic ---
    function activateThreePoint(viewName) {
        // Hide other button if active
        if (threePointState.active && threePointState.view && threePointState.view !== viewName) {
            document.getElementById(`btn-3pt-cancel-${threePointState.view}`).style.display = 'none';
        }
        
        threePointState = { active: true, view: viewName, points: [], mouseX: -100, mouseY: -100 };
        const cvs = (viewName === 'profile') ? cvsProfile : cvsPlan;
        cvs.style.cursor = 'crosshair';
        document.getElementById(`btn-3pt-cancel-${viewName}`).style.display = 'block';
        draw();
    }

    function cancelThreePoint(viewName) {
        threePointState = { active: false, view: null, points: [], mouseX: -100, mouseY: -100 };
        const cvs = (viewName === 'profile') ? cvsProfile : cvsPlan;
        cvs.style.cursor = 'grab';
        document.getElementById(`btn-3pt-cancel-${viewName}`).style.display = 'none';
        draw();
    }

    function handleThreePointClick(e, viewName) {
        const cvs = (viewName === 'profile') ? cvsProfile : cvsPlan;
        const rect = cvs.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        threePointState.points.push({ x, y });

        if (threePointState.points.length === 3) {
            finishThreePointAlign();
        } else {
            draw();
        }
    }
    
    function handleThreePointTouch(e, viewName) {
        e.preventDefault(); // Prevent scrolling
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent("mousedown", {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        handleThreePointClick(mouseEvent, viewName);
    }

    function finishThreePointAlign() {
        const pts = threePointState.points;
        const viewName = threePointState.view;
        
        document.getElementById(`btn-3pt-cancel-${viewName}`).style.display = 'none';
        
        // Calculate Circle Center and Radius from 3 points
        // Using determinant method or perpendicular bisectors
        const x1 = pts[0].x, y1 = pts[0].y;
        const x2 = pts[1].x, y2 = pts[1].y;
        const x3 = pts[2].x, y3 = pts[2].y;

        const D = 2 * (x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2));
        
        if (Math.abs(D) < 0.001) {
            alert("Points are collinear. Please try again.");
            threePointState = { active: false, view: null, points: [] };
            draw();
            return;
        }

        const Ux = ((x1*x1 + y1*y1) * (y2 - y3) + (x2*x2 + y2*y2) * (y3 - y1) + (x3*x3 + y3*y3) * (y1 - y2)) / D;
        const Uy = ((x1*x1 + y1*y1) * (x3 - x2) + (x2*x2 + y2*y2) * (x1 - x3) + (x3*x3 + y3*y3) * (x2 - x1)) / D;

        const r = Math.sqrt((x1 - Ux)**2 + (y1 - Uy)**2);

        // Update View State
        const cvs = (viewName === 'profile') ? cvsProfile : cvsPlan;
        viewState[viewName].x = Ux - (cvs.width / 2);
        viewState[viewName].y = Uy - (cvs.height / 2);
        
        const baseDiameter = (Math.min(cvs.width, cvs.height) * 0.8);
        viewState[viewName].scale = (r * 2) / baseDiameter;

        // Reset Tool
        threePointState = { active: false, view: null, points: [], mouseX: -100, mouseY: -100 };
        cvs.style.cursor = 'grab';
        draw();
    }

    // --- 2-Point Octagon Auto-Reposition Tool ---
    // User picks 2 opposite corners of the octagon on the photo.
    // This computes rotation and table % to fit the octagon, WITHOUT changing the big circle.
    function activateTwoPointOctagon() {
        // Cancel 3-point if active
        if (threePointState.active) cancelThreePoint(threePointState.view);
        
        twoPointOctState = { active: true, points: [], mouseX: -100, mouseY: -100 };
        cvsPlan.style.cursor = 'crosshair';
        document.getElementById('btn-2pt-cancel').style.display = 'block';
        const cancelPlan = document.getElementById('btn-2pt-cancel-plan');
        if (cancelPlan) cancelPlan.style.display = 'block';
        document.getElementById('2pt-hint').style.display = 'block';
        document.getElementById('2pt-hint').textContent = 'Click point 1 of 2 (one octagon corner)';
        draw();
    }

    function cancelTwoPointOctagon() {
        twoPointOctState = { active: false, points: [], mouseX: -100, mouseY: -100 };
        cvsPlan.style.cursor = 'grab';
        document.getElementById('btn-2pt-cancel').style.display = 'none';
        const cancelPlan = document.getElementById('btn-2pt-cancel-plan');
        if (cancelPlan) cancelPlan.style.display = 'none';
        document.getElementById('2pt-hint').style.display = 'none';
        draw();
    }

    function handleTwoPointClick(e) {
        const rect = cvsPlan.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        twoPointOctState.points.push({ x, y });
        
        if (twoPointOctState.points.length === 1) {
            document.getElementById('2pt-hint').textContent = 'Click point 2 of 2 (the OPPOSITE octagon corner)';
            draw();
        } else if (twoPointOctState.points.length === 2) {
            finishTwoPointOctagon();
        }
    }

    function finishTwoPointOctagon() {
        const p1 = twoPointOctState.points[0];
        const p2 = twoPointOctState.points[1];
        
        // The two points are opposite corners of the octagon.
        // The diagonal of a regular octagon spans across the center.
        // Midpoint = center of octagon
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        
        // Distance = diagonal of the octagon
        const diag = Math.sqrt((p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2);
        
        // For a regular octagon, the diagonal (vertex to opposite vertex) = 2 * R
        // where R is the circumradius. So tableRadius (circumradius) = diag / 2
        const tableRadiusPx = diag / 2;
        
        // Angle of the diagonal determines the rotation.
        // In the octagon drawing, the first vertex is at angle (PI/8) from the positive x-axis.
        // Opposite vertices are separated by 4 steps = 4 * (2*PI/8) = PI radians.
        // So if p1 is vertex i, the line p1→p2 makes angle = theta_i = i*(PI/4) + PI/8
        // We measure the angle of the user's line, then compute what rotation offset
        // the diagram needs to match.
        const userAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        
        // The octagon vertices in the diagram code are drawn at angles:
        //   theta_i = i * (2*PI/8) + PI/8 + viewState.plan.rotate
        // A diagonal from vertex i to vertex (i+4) has direction theta_i.
        // We need: theta_i = userAngle (mod PI, since the diagonal is symmetric)
        // So: viewState.plan.rotate = userAngle - (PI/8) - k*(PI/4)  for the nearest k
        // We pick the k that minimizes the rotation change.
        const baseAngle = Math.PI / 8; // default octagon offset in renderPlan
        let bestRotate = viewState.plan.rotate;
        let bestDiff = Infinity;
        for (let k = 0; k < 8; k++) {
            const candidateRotate = userAngle - baseAngle - k * (Math.PI / 4);
            // Normalize to nearest current rotation
            let diff = candidateRotate - viewState.plan.rotate;
            // Normalize diff to [-PI, PI]
            diff = ((diff + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
            if (Math.abs(diff) < Math.abs(bestDiff)) {
                bestDiff = diff;
                bestRotate = viewState.plan.rotate + diff;
            }
        }
        
        // Apply rotation to the diagram (this rotates everything: circle + table + arrows)
        viewState.plan.rotate = bestRotate;
        
        // Now compute table % from the pixel measurements.
        // The big circle radius in pixels = (minDim * 0.8) / 2 * viewState.plan.scale
        const minDimPlan = Math.min(cvsPlan.width, cvsPlan.height);
        const circleRadiusPx = (minDimPlan * 0.8 / 2) * viewState.plan.scale;
        
        // Table % = (tableRadius / circleRadius) * 100
        let newTablePct = (tableRadiusPx / circleRadiusPx) * 100;
        
        // Clamp to slider limits
        newTablePct = Math.max(40, Math.min(70, newTablePct));
        
        // Update the table percentage
        config.tablePct = newTablePct;
        document.getElementById('tablePct').value = newTablePct;
        document.getElementById('val-table').textContent = newTablePct.toFixed(1);
        
        // Also recenter the table offset relative to the octagon midpoint
        // Convert the midpoint from screen coords to diagram-local coords
        // Screen coords: midX, midY  
        // Diagram center in screen coords: cvsPlan.width/2 + viewState.plan.x, cvsPlan.height/2 + viewState.plan.y
        const diagCenterX = cvsPlan.width / 2 + viewState.plan.x;
        const diagCenterY = cvsPlan.height / 2 + viewState.plan.y;
        
        // Offset from diagram center, in screen pixels
        const offScreenX = midX - diagCenterX;
        const offScreenY = midY - diagCenterY;
        
        // Convert to local diagram coords (undo scale and rotation)
        const cos = Math.cos(viewState.plan.rotate);
        const sin = Math.sin(viewState.plan.rotate);
        const scale = viewState.plan.scale;
        offsets.table.x = (offScreenX * cos + offScreenY * sin) / scale;
        offsets.table.y = (-offScreenX * sin + offScreenY * cos) / scale;
        
        // Reset tool
        cancelTwoPointOctagon();
        draw();
    }

    function renderTwoPointUI(ctx, w, h) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        
        // Instruction bar
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, h - 40, w, 40);
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const step = twoPointOctState.points.length + 1;
        ctx.fillText(`Click corner ${step} of 2 on the octagon (opposite corners)`, w / 2, h - 20);

        // Draw placed points
        twoPointOctState.points.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#a78bfa';
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Label
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`P${i+1}`, p.x, p.y - 12);
        });

        // Draw dashed line between the 2 points if both exist
        if (twoPointOctState.points.length === 2) {
            const a = twoPointOctState.points[0];
            const b = twoPointOctState.points[1];
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (twoPointOctState.points.length === 1 && twoPointOctState.mouseX > 0) {
            // Draw a preview line from placed point to mouse
            const a = twoPointOctState.points[0];
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(twoPointOctState.mouseX, twoPointOctState.mouseY);
            ctx.strokeStyle = 'rgba(167, 139, 250, 0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Draw Loupe (Magnifier) for precise placement
        if (twoPointOctState.mouseX > 0) {
            const mx = twoPointOctState.mouseX;
            const my = twoPointOctState.mouseY;
            const zoom = 3;
            const r = 60;

            ctx.save();
            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(mx - r, my - r, r * 2, r * 2);

            const ov = overlays.plan;
            let source = null;
            if (ov.type === 'camera' && ov.elVid.style.display !== 'none') source = ov.elVid;
            else if (ov.type === 'image' && ov.elImg.style.display !== 'none') source = ov.elImg;

            if (source) {
                ctx.translate(mx, my);
                ctx.scale(zoom, zoom);
                ctx.translate(-mx, -my);
                drawTransformedImage(ctx, source, imageState.plan, w, h);
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(mx - 10, my); ctx.lineTo(mx + 10, my);
            ctx.moveTo(mx, my - 10); ctx.lineTo(mx, my + 10);
            ctx.strokeStyle = '#a78bfa';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.restore();
    }

    // --- Freeze/Unfreeze Functionality ---
    function toggleFreeze(viewName) {
        const ov = overlays[viewName];
        
        // Ensure live tracking is off before freezing
        if (trackingState[viewName].active) toggleLiveTracking(viewName);

        if (ov.type === 'camera') {
            // 1. Freeze: Capture frame (including digital zoom crop if active)
            const tempCanvas = document.createElement('canvas');
            const w = ov.elVid.videoWidth;
            const h = ov.elVid.videoHeight;
            if(w === 0 || h === 0) return; // Video not ready
            
            // If digital zoom is active, crop the center region
            const zoom = digitalZoomLevel;
            const cropW = Math.floor(w / zoom);
            const cropH = Math.floor(h / zoom);
            const cropX = Math.floor((w - cropW) / 2);
            const cropY = Math.floor((h - cropH) / 2);
            
            tempCanvas.width = cropW;
            tempCanvas.height = cropH;
            const tempCtx = tempCanvas.getContext('2d');
            
            // If selfie, flip horizontally in the captured image
            if (isCurrentCameraFront()) {
                tempCtx.translate(cropW, 0);
                tempCtx.scale(-1, 1);
            }
            tempCtx.drawImage(ov.elVid, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            // Capture the video frame to the image element
            ov.elImg.src = tempCanvas.toDataURL('image/jpeg', 0.9);
            ov.elImg.style.display = 'block';
            ov.elImg.style.transform = ''; // Reset any transforms on the frozen image
            
            // 2. Stop Camera logic manually to keep state clean
            ov.elVid.srcObject = null;
            ov.elVid.style.display = 'none';
            ov.elVid.style.transform = '';
            ov.type = 'image';
            const shutterBtn = document.getElementById(`shutter-${viewName}`);
            shutterBtn.classList.remove('active-cam');
            updateCamLabel(viewName);
            
            // Stop shared stream if unused
            const otherView = viewName === 'profile' ? 'plan' : 'profile';
            if (overlays[otherView].type !== 'camera' && sharedStream) {
                sharedStream.getTracks().forEach(t => t.stop());
                sharedStream = null;
                digitalZoomLevel = 1;
                updateZoomControls();
            }
            
            // 3. Auto-Align immediately after freeze
            autoAlign(viewName, false);

        } else {
            // If nothing active, just start camera
            toggleCamera(viewName);
        }
    }

        function toggleMaximize(viewName) {
        const main = document.querySelector('main');
        const container = document.getElementById(`container-${viewName}`);
        const otherViewName = viewName === 'profile' ? 'plan' : 'profile';
        const otherContainer = document.getElementById(`container-${otherViewName}`);
        const maximizeBtn = document.getElementById(`btn-maximize-${viewName}`);

        if (otherContainer.style.display === 'none') {
            // Currently maximized (other is hidden), so revert to normal
            otherContainer.style.display = ''; // Revert to default (flex item)
            maximizeBtn.textContent = '🗖'; // Maximize icon
            maximizeBtn.title = 'Toggle Fullscreen View';
            main.classList.remove('is-maximized');
        } else {
            // Maximize this view (hide other)
            otherContainer.style.display = 'none';
            maximizeBtn.textContent = '🗗'; // Restore icon
            maximizeBtn.title = 'Restore View';
            main.classList.add('is-maximized');
        }
        // Redraw after layout finishes
        requestAnimationFrame(resize);
    }
    
    // Helper for Object-Fit: Contain drawing on canvas (Matches CSS)
    function drawImageProp(ctx, img, x, y, w, h, offsetX, offsetY) {
        if (arguments.length === 2) {
            x = y = 0;
            w = ctx.canvas.width;
            h = ctx.canvas.height;
        }

        const iw = img.naturalWidth || img.videoWidth || img.width;
        const ih = img.naturalHeight || img.videoHeight || img.height;
        if (!iw || !ih) return;

        // Contain logic: Scale to fit within w/h while maintaining aspect ratio
        const r = Math.min(w / iw, h / ih);
        const nw = iw * r;
        const nh = ih * r;
        
        // Center alignment
        const dx = x + (w - nw) * 0.5;
        const dy = y + (h - nh) * 0.5;

        ctx.drawImage(img, 0, 0, iw, ih, dx, dy, nw, nh);
    }

    // --- Interaction Logic (Pan/Zoom/Rotate) ---
    function attachInteraction(canvas, viewName) {
        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            if (twoPointOctState.active && viewName === 'plan') {
                handleTwoPointClick(e);
            } else if (threePointState.active && threePointState.view === viewName) {
                handleThreePointClick(e, viewName);
            } else {
                startDrag(e, viewName);
            }
        });
        window.addEventListener('mousemove', (e) => drag(e, viewName));
        window.addEventListener('mouseup', () => endDrag(viewName));
        
        // Loupe Movement
        canvas.addEventListener('mousemove', (e) => {
            if (twoPointOctState.active && viewName === 'plan') {
                const rect = canvas.getBoundingClientRect();
                twoPointOctState.mouseX = e.clientX - rect.left;
                twoPointOctState.mouseY = e.clientY - rect.top;
                draw();
            } else if (threePointState.active && threePointState.view === viewName) {
                const rect = canvas.getBoundingClientRect();
                threePointState.mouseX = e.clientX - rect.left;
                threePointState.mouseY = e.clientY - rect.top;
                draw();
            }
        });

        // Touch Events for 2-Point and 3-Point
        canvas.addEventListener('touchstart', (e) => {
             if (twoPointOctState.active && viewName === 'plan') {
                 e.preventDefault();
                 const touch = e.touches[0];
                 handleTwoPointClick({ clientX: touch.clientX, clientY: touch.clientY });
             } else if (threePointState.active && threePointState.view === viewName) {
                 handleThreePointTouch(e, viewName);
             }
        }, { passive: false });

        // Wheel (Zoom + Rotate with Shift)
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const mode = controlModes[viewName];
            const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];
            
            if (e.shiftKey) {
                // Rotate
                s.rotate += e.deltaY * 0.002;
            } else {
                // Zoom
                s.scale -= e.deltaY * 0.001;
                s.scale = Math.max(0.01, Math.min(s.scale, 5));
            }
            
            if (mode === 'image') updateImageTransform(viewName);
            draw();
        });
        
        // --- TOUCH INTERACTION (Pinch/Zoom/Drag/Tap) ---
        let touchStartDist = 0;
        let touchStartAngle = 0;
        let initialScale = 1;
        let initialRotate = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            if (threePointState.active) return; // Let 3-point logic handle it
            e.preventDefault();
            
            if (e.touches.length === 1) {
                startDrag({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }, viewName);
            } else if (e.touches.length === 2) {
                touchStartDist = getTouchDist(e.touches);
                touchStartAngle = getTouchAngle(e.touches);
                
                const mode = controlModes[viewName];
                const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];
                initialScale = s.scale;
                initialRotate = s.rotate;

                if (overlays[viewName].type === 'camera' && sharedStream) {
                    const track = sharedStream.getVideoTracks()[0];
                    initialOpticalZoom = track.getSettings().zoom || 1;
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (twoPointOctState.active && viewName === 'plan') {
                const rect = canvas.getBoundingClientRect();
                twoPointOctState.mouseX = e.touches[0].clientX - rect.left;
                twoPointOctState.mouseY = e.touches[0].clientY - rect.top;
                draw();
                return;
            }
            if (threePointState.active) {
                // Update Loupe position for touch
                 const rect = canvas.getBoundingClientRect();
                 threePointState.mouseX = e.touches[0].clientX - rect.left;
                 threePointState.mouseY = e.touches[0].clientY - rect.top;
                 draw();
                 return;
            }
            
            e.preventDefault();
            const mode = controlModes[viewName];
            const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];

            if (e.touches.length === 1) {
                 drag({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }, viewName);
            } else if (e.touches.length === 2) {
                const dist = getTouchDist(e.touches);
                const scaleFactor = dist / touchStartDist;

                const ov = overlays[viewName];
                if (ov.type === 'camera' && sharedStream) {
                    // OPTICAL ZOOM
                    const track = sharedStream.getVideoTracks()[0];
                    const capabilities = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
                    
                    if (capabilities.zoom) {
                        let targetZoom = initialOpticalZoom * scaleFactor;
                        targetZoom = Math.max(capabilities.zoom.min, Math.min(targetZoom, capabilities.zoom.max));
                        
                        track.applyConstraints({
                            advanced: [{zoom: targetZoom}]
                        }).catch(err => console.error("Optical zoom error", err));

                        // Sync UI slider if visible
                        const slider = document.getElementById('cameraZoom');
                        if (slider) {
                            slider.value = targetZoom;
                            document.getElementById('val-cameraZoom').textContent = targetZoom.toFixed(1) + 'x';
                        }
                    }
                } else {
                    // DIAGRAM/IMAGE SCALE
                    s.scale = Math.max(0.01, Math.min(initialScale * scaleFactor, 5));
                }

                // Rotate
                const angle = getTouchAngle(e.touches);
                s.rotate = initialRotate + (angle - touchStartAngle);
                
                if (mode === 'image') updateImageTransform(viewName);
                draw();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
             endDrag(viewName);
             // Reset loupe if 3-point active
             if(threePointState.active) {
                 threePointState.mouseX = -100;
                 threePointState.mouseY = -100;
                 draw();
             }
        });
    }
    
    function getTouchDist(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }
    function getTouchAngle(touches) {
        return Math.atan2(touches[1].clientY - touches[0].clientY, touches[1].clientX - touches[0].clientX);
    }

    function startDrag(e, viewName) {
        const mode = controlModes[viewName];
        const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];
        s.isDragging = true;
        s.lastX = e.clientX;
        s.lastY = e.clientY;
    }

    function drag(e, viewName) {
        const mode = controlModes[viewName];
        const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];
        if (!s.isDragging) return;
        
        const dx = e.clientX - s.lastX;
        const dy = e.clientY - s.lastY;
        s.lastX = e.clientX;
        s.lastY = e.clientY;

        // While a shape is armed, plan-view drags nudge that shape instead of panning
        if (offsetTarget && viewName === 'plan') {
            const st = viewState.plan;
            const cos = Math.cos(st.rotate);
            const sin = Math.sin(st.rotate);
            const o = offsets[offsetTarget];
            o.x += (dx * cos + dy * sin) / st.scale;
            o.y += (-dx * sin + dy * cos) / st.scale;
            draw();
            return;
        }

        // For image, we move it directly; for diagram we move origin
        s.x += dx;
        s.y += dy;
        
        if (mode === 'image') updateImageTransform(viewName);
        draw();
    }

    function endDrag(viewName) {
        const mode = controlModes[viewName];
        const s = (mode === 'diagram') ? viewState[viewName] : imageState[viewName];
        s.isDragging = false;
    }

    function updateImageTransform(viewName) {
        const ist = imageState[viewName];
        const transform = `translate(${ist.x}px, ${ist.y}px) rotate(${ist.rotate}rad) scale(${ist.scale})`;
        const ov = overlays[viewName];
        if(ov.elVid) ov.elVid.style.transform = transform;
        if(ov.elImg) ov.elImg.style.transform = transform;
    }

    // Offset Controls
    const offsetButtons = {
        reflect: document.getElementById('btn-offset-reflect'),
        table: document.getElementById('btn-offset-table')
    };
    const offsetHint = document.getElementById('offset-hint');

    function setOffsetTarget(target) {
        offsetTarget = offsetTarget === target ? null : target;
        Object.keys(offsetButtons).forEach(key => {
            offsetButtons[key].classList.toggle('active', offsetTarget === key);
        });
        offsetHint.textContent = offsetTarget
            ? `Drag on Crown View to move the ${offsetTarget === 'table' ? 'table octagon' : 'dashed circle'}`
            : 'Pick a shape, then drag on Crown View';
        draw();
    }

    offsetButtons.reflect.addEventListener('click', () => setOffsetTarget('reflect'));
    offsetButtons.table.addEventListener('click', () => setOffsetTarget('table'));
    document.getElementById('btn-offset-reset').addEventListener('click', () => {
        const targets = offsetTarget ? [offsetTarget] : Object.keys(offsets);
        targets.forEach(key => { offsets[key].x = 0; offsets[key].y = 0; });
        draw();
    });

    // Event Listeners
    pavDepthInput.addEventListener('input', (e) => {
        config.pavDepthPct = parseFloat(e.target.value);
        config.pavAngle = pavAngleFromDepth(config.pavDepthPct);
        const display = document.getElementById('val-pav');
        if (display) display.textContent = config.pavDepthPct.toFixed(1);
        updatePavBubble();
        draw();
    });

    Object.keys(inputs).forEach(key => {
        inputs[key].addEventListener('input', (e) => {
            config[key] = parseFloat(e.target.value);
            // Update text display
            const display = document.getElementById(`val-${key.replace('Pct', '').replace('Thick', '').replace('Angle', '').replace('Ratio', '')}`);
            if(display) display.textContent = config[key];
            
            draw();
        });
    });

    // Attach Interactions
    attachInteraction(cvsProfile, 'profile');
    attachInteraction(cvsPlan, 'plan');

    window.addEventListener('resize', () => { resize(); updatePavBubble(); });

    // Init
    config.pavAngle = pavAngleFromDepth(config.pavDepthPct);
    updatePavBubble();
    resize();
    toggleMaximize('plan'); // Start with Crown View maximized by default

</script>
