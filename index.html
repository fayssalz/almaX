<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parametric Diamond Scheme Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Control Panel Styles */
        aside {
            width: 300px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 5px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 0px;
            overflow-y: auto;
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            font-weight: 300;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Custom button styles */
        button, .file-label {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: opacity 0.2s;
        }
        .file-label {
            display: block;
        }
        button:hover, .file-label:hover {
            opacity: 0.9;
        }
        /* Button specific overrides */
        #clearBg {
            background-color: #64748b;
            color: var(--text);
            margin-top: 8px;
        }

        .value-display {
            color: var(--accent);
            font-weight: bold;
        }

        .slider-with-bubble {
            position: relative;
            padding-top: 22px;
        }

        .slider-bubble {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--bg-color);
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .offset-buttons {
            display: flex;
            gap: 5px;
        }

        .offset-btn {
            flex: 1;
            padding: 6px 4px;
            font-size: 0.75rem;
            background: rgba(148, 163, 184, 0.2);
            color: var(--text);
        }

        .offset-btn.active {
            background: #facc15;
            color: var(--bg-color);
        }

        .offset-btn.reset {
            flex: 0 0 34px;
        }

        .offset-hint {
            font-size: 0.7rem;
            color: #64748b;
        }

        .slider-bubble::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--accent);
        }

        /* Canvas Area */
        main {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 10px;
            padding: 10px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            transition: background 0.3s ease;
        }

        .view-container {
            flex: 1;
            position: relative;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        video, img.overlay-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit:contain;
            z-index: 5; /* Behind canvas */
            display: none; /* Hidden by default */
            filter: contrast(100%) brightness(100%);
            transition: filter 0.3s;
        }
        .high-contrast {
            filter: contrast(150%) brightness(110%) grayscale(100%) !important;
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 20;
        }

        .view-label {
            position: absolute;
            top: 45px; left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #fff;
            z-index: 20;
            pointer-events: none;
        }

        .view-toolbar {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 30;
            display: flex;
            gap: 5px;
        }
        .view-toolbar button, .view-toolbar label.toolbar-btn {
            padding: 4px 8px;
            font-size: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            border-radius: 4px; /* Ensure consistency */
        }
        .view-toolbar label.toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Shutter Button */
        .shutter-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 40;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .shutter-btn:active {
            transform: translateX(-50%) scale(0.9);
            background: #e2e8f0;
        }
        .shutter-btn.active-cam {
            border-color: #38bdf8;
        }
        .cam-mode-label {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 10px;
            z-index: 41;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }

        .view-toolbar label.toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .view-toolbar button:hover, .view-toolbar label.toolbar-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        /* Results Section */
        .results-panel {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        /* Mobile / Responsive Adjustments */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            aside {
                width: 100%;
                height: auto;
                order: 2;
                border-right: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                box-sizing: border-box;
                overflow: visible;
            }
            main {
                width: 95%;
                height: 160vh;
                order: 1;
                flex-direction: column;
            }
        main.is-maximized {
            height: 80vh; /* Keeps the view at its original size when maximized on mobile */
        }
            .legend {
                display: none; /* Hide legend on small screens */
            }
        }
    </style>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <script>
        let cvReady = false;
        function onOpenCvReady() {
            cvReady = true;
            console.log("OpenCV.js successfully loaded and initialized.");
            document.querySelectorAll('button[title="Loading AI..."]').forEach(btn => {
                btn.textContent = '🪄';
                btn.title = 'Auto-Fit to Diamond';
            });
        }
    </script>
</head>
<body>

<aside>
    <h2>Diamond Params</h2>
    <!-- Controls -->
    <div class="control-group" id="cameraZoomContainer" style="display:none;">
        <label>Optical Zoom <span id="val-cameraZoom">1.0x</span></label>
        <input type="range" id="cameraZoom" min="1" max="1" step="0.1" value="1">
    </div>

    <div class="control-group">
        <label>Table Width (%) <span id="val-table">57</span></label>
        <input type="range" id="tablePct" min="40" max="70" value="57" step="0.1">
    </div>

    <div class="control-group">
        <label>Crown Angle (°) <span id="val-crown">34.5</span></label>
        <input type="range" id="crownAngle" min="20" max="45" value="34.5" step="0.1">
    </div>

    <div class="control-group">
        <label>Pavilion Depth (%) <span id="val-pav">43.1</span></label>
        <div class="slider-with-bubble">
            <span class="slider-bubble" id="bubble-pav">43.1%/40.75°</span>
            <input type="range" id="pavDepth" min="35" max="60" value="43.1" step="0.1">
        </div>
    </div>

    <div class="control-group">
        <label>Girdle Thickness (%) <span id="val-girdle">3</span></label>
        <input type="range" id="girdleThick" min="0.2" max="12" value="3" step="0.1">
    </div>

    
    
    <div class="control-group">
        <label>LGF Ratio <span id="val-lgf">0.78</span></label>
        <input type="range" id="lgfRatio" min="0.65" max="0.90" value="0.78" step="0.01">
    </div>
    
    <div class="control-group">
        <label>Overlay Offset</label>
        <div class="offset-buttons">
            <button type="button" class="offset-btn" id="btn-offset-reflect" title="Move the dashed pavilion circle">◌ Circle</button>
            <button type="button" class="offset-btn" id="btn-offset-table" title="Move the table octagon">⬡ Table</button>
            <button type="button" class="offset-btn reset" id="btn-offset-reset" title="Recenter offsets">↺</button>
        </div>
        <span class="offset-hint" id="offset-hint">Pick a shape, then drag on Crown View</span>
    </div>

    <div class="control-group">
        <label>Octagon Auto-Fit</label>
        <button type="button" id="btn-2pt-octagon" onclick="activateTwoPointOctagon()" title="Pick 2 opposite corners of the table octagon to auto-rotate & resize">⬡ 2-Point Table Align</button>
        <button type="button" id="btn-2pt-cancel" style="display:none; background:#ef4444; color:#fff;" onclick="cancelTwoPointOctagon()">✕ Cancel</button>
        <span class="offset-hint" id="2pt-hint" style="display:none;">Click 2 opposite corners of the octagon on the photo</span>
    </div>

    <!-- Calculated Results -->
    <div class="results-panel">
        <div class="result-row">
            <span style="color:#94a3b8">Total Depth</span>
            <span class="value-display" id="res-total">--%</span>
        </div>
        <div class="result-row">
            <span style="color:#94a3b8">Crown Height</span>
            <span class="value-display" id="res-crown-h">--%</span>
        </div>
        <div class="result-row">
            <span style="color:#94a3b8">Pavilion Depth</span>
            <span class="value-display" id="res-pav-d">--%</span>
        </div>
        <div class="result-row">
            <span style="color:#38bdf8">Arrow Limit (Crown)</span>
            <span class="value-display" id="res-arr">--%</span>
        </div>
    </div>

    <div style="margin-top:auto; font-size: 0.75rem; color: #64748b;">
        Views: Profile (Left) & Plan (Right)
    </div>
</aside>

<main>
    <!-- Profile Container -->
    <div class="view-container" id="container-profile">
        <div class="view-label">PROFILE VIEW</div>
        <div class="view-toolbar">
            <button onclick="switchCamera()" class="btn-switch-cam" title="Switch Camera" style="display:none;">🔄</button>
            <button onclick="toggleControlMode('profile')" id="btn-mode-profile" title="Control Mode: Diagram">🔎</button>
            <label class="toolbar-btn" title="Upload Image">
                📂<input type="file" onchange="handleImageUpload(event, 'profile')" accept="image/*" style="display:none;">
            </label>
            <button onclick="pasteFromClipboard('profile')" title="Paste Image">📋</button>
            <button onclick="clearOverlay('profile')" title="Clear Overlay">✕</button>
            <span style="border-left:1px solid rgba(255,255,255,0.2); margin:0 4px;"></span>
            <button onclick="activateThreePoint('profile')" title="3-Point Circle Align">∴</button>
            <button onclick="cancelThreePoint('profile')" id="btn-3pt-cancel-profile" style="display:none; color:#ef4444;" title="Cancel 3-Point">✕</button>
            <button onclick="toggleLiveTracking('profile')" title="Loading AI...">⏳</button>
            <button onclick="resetAlignment('profile')" title="Reset Alignment">⟳</button>
            <button id="btn-maximize-profile" onclick="toggleMaximize('profile')" title="Toggle Fullscreen View">🗖</button>
        </div>
        <canvas id="canvasProfile"></canvas>
        <video id="vid-profile" autoplay playsinline muted></video>
        <img id="img-profile" class="overlay-img" />
        <div class="cam-mode-label" id="cam-label-profile"></div>
        <div class="shutter-btn" id="shutter-profile" onclick="handleShutter('profile')" title="Start/Capture"></div>
    </div>

    <!-- Plan Container -->
    <div class="view-container" id="container-plan">
        <div class="view-label">CROWN VIEW</div>
        <div class="view-toolbar">
            <button onclick="switchCamera()" class="btn-switch-cam" title="Switch Camera" style="display:none;">🔄</button>
            <button onclick="toggleControlMode('plan')" id="btn-mode-plan" title="Control Mode: Diagram">🔎</button>
            <label class="toolbar-btn" title="Upload Image">
                📂<input type="file" onchange="handleImageUpload(event, 'plan')" accept="image/*" style="display:none;">
            </label>
            <button onclick="pasteFromClipboard('plan')" title="Paste Image">📋</button>
            <button onclick="clearOverlay('plan')" title="Clear Overlay">✕</button>
            <span style="border-left:1px solid rgba(255,255,255,0.2); margin:0 4px;"></span>
            <button onclick="activateThreePoint('plan')" title="3-Point Circle Align">∴</button>
            <button onclick="cancelThreePoint('plan')" id="btn-3pt-cancel-plan" style="display:none; color:#ef4444;" title="Cancel 3-Point">✕</button>
            <button onclick="activateTwoPointOctagon()" title="2-Point Octagon Align">⬡</button>
            <button onclick="cancelTwoPointOctagon()" id="btn-2pt-cancel-plan" style="display:none; color:#ef4444;" title="Cancel 2-Point">✕</button>
            <button onclick="toggleLiveTracking('plan')" title="Loading AI...">⏳</button>
            <button onclick="resetAlignment('plan')" title="Reset Alignment">⟳</button>
            <button id="btn-maximize-plan" onclick="toggleMaximize('plan')" title="Toggle Fullscreen View">🗖</button>
        </div>
        <canvas id="canvasPlan"></canvas>
        <video id="vid-plan" autoplay playsinline muted></video>
        <img id="img-plan" class="overlay-img" />
        <div class="cam-mode-label" id="cam-label-plan"></div>
        <div class="shutter-btn" id="shutter-plan" onclick="handleShutter('plan')" title="Start/Capture"></div>
        <div class="legend">Parametric Render</div>
    </div>
</main>

<script>
    // Get contexts for both canvases
    const cvsProfile = document.getElementById('canvasProfile');
    const ctxProfile = cvsProfile.getContext('2d');

    const cvsPlan = document.getElementById('canvasPlan');
    const ctxPlan = cvsPlan.getContext('2d');

    // Configuration State
    const config = {
        tablePct: 57,
        crownAngle: 34.5,
        pavDepthPct: 43.1,
        pavAngle: 40.75,
        girdleThickPct: 3,
        lgfRatio: 0.78,
        baseSize: 300 // The "100%" diameter in pixels
    };

    // UI Elements map
    const inputs = {
        tablePct: document.getElementById('tablePct'),
        crownAngle: document.getElementById('crownAngle'),
        girdleThickPct: document.getElementById('girdleThick'),
        lgfRatio: document.getElementById('lgfRatio')
    };

    // Overlay State
    let sharedStream = null;
    let videoDevices = []; // All cameras: rear cameras + selfie camera
    let currentDeviceIndex = 0;
    let digitalZoomLevel = 1; // For camera digital zoom (especially selfie camera)
    const overlays = {
        profile: { type: null, elVid: document.getElementById('vid-profile'), elImg: document.getElementById('img-profile'), btnCam: document.getElementById('btn-cam-profile') },
        plan:    { type: null, elVid: document.getElementById('vid-plan'),    elImg: document.getElementById('img-plan'),    btnCam: document.getElementById('btn-cam-plan') }
    };

    // View State for manual alignment (Pan, Zoom, Rotate)
    const viewState = {
        profile: { x: 0, y: 0, scale: 1, rotate: 0, isDragging: false, lastX: 0, lastY: 0 },
        plan:    { x: 0, y: 0, scale: 1, rotate: 0, isDragging: false, lastX: 0, lastY: 0 }
    };

    // State for Image Transforms
    const imageState = {
        profile: { x: 0, y: 0, scale: 1, rotate: 0 },
        plan:    { x: 0, y: 0, scale: 1, rotate: 0 }
    };
    const controlModes = { profile: 'diagram', plan: 'diagram' }; // 'diagram' or 'image'

    // Offsets (in plan-view local units) for aligning shapes with off-center photos
    const offsets = {
        reflect: { x: 0, y: 0 },
        table:   { x: 0, y: 0 }
    };
    let offsetTarget = null; // 'reflect' | 'table' | null

    // State for 3-Point Tool
    let threePointState = { active: false, view: null, points: [], mouseX: -100, mouseY: -100 };

    // State for 2-Point Octagon Tool
    let twoPointOctState = { active: false, points: [], mouseX: -100, mouseY: -100 };

    // Tracking State
    const trackingState = {
        profile: { active: false },
        plan:    { active: false }
    };
    let initialOpticalZoom = 1;

    // Helper: Resize canvas to fit window with high DPI support
    function resize() {
        resizeCanvas(cvsProfile);
        resizeCanvas(cvsPlan);
        draw();
    }
    
    function resizeCanvas(c) {
        const parent = c.parentElement;
        c.width = parent.clientWidth;
        c.height = parent.clientHeight;
    }

    // Helper: Convert degrees to radians
    const rad = (deg) => deg * (Math.PI / 180);

    // Pavilion depth (% of diameter) and pavilion angle are two views of the same value
    const pavAngleFromDepth = (depthPct) => Math.atan(depthPct / 50) * (180 / Math.PI);

    const pavDepthInput = document.getElementById('pavDepth');
    const pavBubble = document.getElementById('bubble-pav');

    function updatePavBubble() {
        const min = parseFloat(pavDepthInput.min);
        const max = parseFloat(pavDepthInput.max);
        const ratio = (config.pavDepthPct - min) / (max - min);
        const thumb = 16;
        const width = pavDepthInput.offsetWidth;
        const track = width - thumb;
        pavBubble.textContent = `${config.pavDepthPct.toFixed(1)}%/${config.pavAngle.toFixed(2)}°`;
        const half = pavBubble.offsetWidth / 2;
        const target = thumb / 2 + ratio * track;
        pavBubble.style.left = `${Math.max(half, Math.min(width - half, target))}px`;
    }

    // Main Draw Function
    function draw() {
        // 1. CALCULATE & UPDATE PERCENTAGES (Scale-Independent)
        // Using formulas independent of physical pixel size to prevent distortion when hiding containers
        const tableRatio = config.tablePct / 100;
        const crownPct = (1 - tableRatio) * 0.5 * Math.tan(rad(config.crownAngle)) * 100;
        const pavPct = config.pavDepthPct;
        const totalDepthPct = crownPct + config.girdleThickPct + pavPct;

        // Calculate Table Reflection Circle using exact optical ray-tracing
        // The table reflection is the visible image of the table formed by 2 internal reflections.
        const alpha = rad(config.pavAngle);
        const tan4a = Math.tan(4 * alpha);
        const tan_a = Math.tan(alpha);
        const sin_a = Math.sin(alpha);
        
        // K factor simplifies the ray reflection intersection math
        const K = 1 / (4 * sin_a * sin_a - 1);
        
        const H_pct = totalDepthPct; 
        const rt_pct = config.tablePct / 2;
        
        // Exact table reflection radius (x0_pct) where internal ray hits edge of the table
        const numerator = H_pct * tan4a + rt_pct;
        const denominator = K * (1 + tan_a * tan4a);
        
        let x0_pct = numerator / denominator;
        
        // Convert to percentage of table radius
        let pavReflectionPct = (x0_pct / rt_pct) * 100;
        
        // Constrain to physical reality limits (0% to 100%)
        pavReflectionPct = Math.max(0, Math.min(100, pavReflectionPct));

        // Calculate Crown / Arrowhead Reflection Limit Using Optical Ray Tracing
        const beta = rad(config.crownAngle);
        const tan_b = Math.tan(beta);
        const R_pct = 50; 
        const D_pct = pavPct; // pavilion depth
        const kr_t = K * rt_pct;
        
        // Use algebraic form that avoids dividing by tan(4a) so it's stable at 45 degrees
        const num_arrow = kr_t * (tan_a * tan4a + 1) - (D_pct + R_pct * tan_b) * tan4a;
        const den_arrow = tan_b * tan4a - 1;
        
        let x_outer_pct = Math.abs(num_arrow / den_arrow);
        let crownReflectionPct = (x_outer_pct / R_pct) * 100;
        crownReflectionPct = Math.max(0, Math.min(100, crownReflectionPct));

        const elResTotal = document.getElementById('res-total');
        const elResCrown = document.getElementById('res-crown-h');
        const elResPav = document.getElementById('res-pav-d');
        const elResArr = document.getElementById('res-arr');
        
        if(elResTotal) elResTotal.textContent = totalDepthPct.toFixed(1) + '%';
        if(elResCrown) elResCrown.textContent = crownPct.toFixed(1) + '%';
        if(elResPav) elResPav.textContent = pavPct.toFixed(1) + '%';
        if(elResArr) elResArr.textContent = crownReflectionPct.toFixed(1) + '%';
        
        // 2. Render Profile (Calculates its own scale based on local canvas size)
        if (document.getElementById('container-profile').style.display !== 'none') {
            const minDimProfile = Math.min(cvsProfile.width, cvsProfile.height);
            const diameter = minDimProfile * 0.8;
            const radius = diameter / 2;
            const tableRadius = radius * tableRatio;
            const crownHeight = (radius - tableRadius) * Math.tan(rad(config.crownAngle));
            const pavilionDepth = radius * Math.tan(rad(config.pavAngle));
            const girdleThickness = diameter * (config.girdleThickPct / 100);

            renderProfile(ctxProfile, cvsProfile.width, cvsProfile.height, radius, tableRadius, crownHeight, pavilionDepth, girdleThickness, crownPct, pavPct, totalDepthPct, viewState.profile);
            if (threePointState.active && threePointState.view === 'profile') {
                renderThreePointUI(ctxProfile, cvsProfile.width, cvsProfile.height);
            }
        }

        // 3. Render Plan (Calculates its own scale based on local canvas size)
        if (document.getElementById('container-plan').style.display !== 'none') {
            const minDimPlan = Math.min(cvsPlan.width, cvsPlan.height);
            const radius = (minDimPlan * 0.8) / 2;
            const tableRadius = radius * tableRatio;

            renderPlan(ctxPlan, cvsPlan.width, cvsPlan.height, radius, tableRadius, pavReflectionPct, crownReflectionPct, viewState.plan);
            if (threePointState.active && threePointState.view === 'plan') {
                renderThreePointUI(ctxPlan, cvsPlan.width, cvsPlan.height);
            }
            if (twoPointOctState.active) {
                renderTwoPointUI(ctxPlan, cvsPlan.width, cvsPlan.height);
            }
        }
    }

    function renderProfile(ctx, w, h, radius, tableRadius, crownHeight, pavilionDepth, girdleThickness, crownPct, pavPct, totalDepthPct, state) {
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        // Apply Manual Alignment
        ctx.translate((w / 2) + state.x, (h / 2) + state.y);
        ctx.scale(state.scale, state.scale);
        ctx.rotate(state.rotate);
        
        ctx.strokeStyle = '#38bdf8'; // Diamond Profile Outline Color
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';
        ctx.fillStyle = 'rgba(56, 189, 248, 0.1)'; // Slightly more opaque

        // Coordinates for Profile
        // Y=0 is the top of the girdle
        const yTable = -crownHeight;
        const yGirdleTop = 0;
        const yGirdleBot = girdleThickness;
        const yCulet = girdleThickness + pavilionDepth;

        ctx.beginPath();
        // Top Left (Table edge)
        ctx.moveTo(-tableRadius, yTable);
        // Top Right (Table edge)
        ctx.lineTo(tableRadius, yTable);
        // Girdle Right Top
        ctx.lineTo(radius, yGirdleTop);
        // Girdle Right Bottom
        ctx.lineTo(radius, yGirdleBot);
        // Culet (Bottom tip)
        ctx.lineTo(0, yCulet);
        // Girdle Left Bottom
        ctx.lineTo(-radius, yGirdleBot);
        // Girdle Left Top
        ctx.lineTo(-radius, yGirdleTop);
        // Close shape
        ctx.closePath();
        
        ctx.fill();
        ctx.stroke();

        // Internal Profile Lines (Schematic)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.moveTo(-radius, yGirdleTop);
        ctx.lineTo(radius, yGirdleTop); // Girdle Line
        ctx.stroke();
        
        // Labels for Profile
        drawDimensionLine(ctx, -radius - 20, yTable, -radius - 20, yGirdleTop, `Crown ${crownPct.toFixed(1)}%`);
        drawDimensionLine(ctx, -radius - 20, yGirdleBot, -radius - 20, yCulet, `Pavilion ${pavPct.toFixed(1)}%`);

        // Total Depth Dimension
        drawDimensionLine(ctx, radius + 40, yTable, radius + 40, yCulet, `Depth ${totalDepthPct.toFixed(1)}%`);

        // Angle Measurements
        // Crown
        ctx.beginPath();
        ctx.setLineDash([2, 2]); 
        ctx.moveTo(-radius, yGirdleTop); ctx.lineTo(-radius + 40, yGirdleTop);
        ctx.stroke();
        ctx.setLineDash([]);
        drawAngleArc(ctx, -radius, yGirdleTop, 25, 0, -rad(config.crownAngle), config.crownAngle);

        // Pavilion
        ctx.beginPath();
        ctx.setLineDash([2, 2]); 
        ctx.moveTo(-radius, yGirdleBot); ctx.lineTo(-radius + 40, yGirdleBot);
        ctx.stroke();
        ctx.setLineDash([]);
        drawAngleArc(ctx, -radius, yGirdleBot, 25, 0, rad(config.pavAngle), config.pavAngle);

        ctx.restore();
    }

    function renderPlan(ctx, w, h, radius, tableRadius, reflectionPct, crownReflectionPct, state) {
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        // Apply Manual Alignment
        ctx.translate((w / 2) + state.x, (h / 2) + state.y);
        ctx.scale(state.scale, state.scale);
        ctx.rotate(state.rotate);

        ctx.strokeStyle = 'RED';
        ctx.lineWidth = 1.2;

        // 1. Draw Outer Circle (Girdle)
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        // 2. Draw Table (Octagon)
        // A standard round brilliant table is an octagon.
        // We rotate it so points align with the star facets
        const segments = 8;
        const tableOff = offsets.table;
        const reflectOff = offsets.reflect;
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
            const theta = (i * 2 * Math.PI / segments) + (Math.PI / 8); // Rotate to offset
            const x = Math.cos(theta) * tableRadius + tableOff.x;
            const y = Math.sin(theta) * tableRadius + tableOff.y;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        if (offsetTarget === 'table') {
            ctx.save();
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();
        } else {
            ctx.stroke();
        }

        // 3. Draw Star Facets & Bezel Facets
        // This connects the table points to the girdle
        for (let i = 0; i < segments; i++) {
            const thetaTable = (i * 2 * Math.PI / segments) + (Math.PI / 8);
            const tx = Math.cos(thetaTable) * tableRadius + tableOff.x;
            const ty = Math.sin(thetaTable) * tableRadius + tableOff.y;

            const thetaGirdle = (i * 2 * Math.PI / segments) + (Math.PI / 8);
            const gx = Math.cos(thetaGirdle) * radius;
            const gy = Math.sin(thetaGirdle) * radius;
            
            // Bezel Facet (Kite shape main lines) - Simplified for schematic
            // Connect Table corner to Girdle
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(gx, gy);
            ctx.strokeStyle = 'RED';
            ctx.stroke();
            
            // Star Facets
            // Connect Table corner to mid-point between girdle points (simplified logic)
            // Ideally, Star facets meet at a point between table and girdle.
        }
        
        // 4. Draw Pavilion Depth Reflection Control (Dashed Circle)
        const rReflect = tableRadius * (reflectionPct / 100);
        if (reflectionPct > 0) {
            ctx.beginPath();
            ctx.arc(reflectOff.x, reflectOff.y, rReflect, 0, Math.PI * 2);
            ctx.setLineDash([3, 3]);
            ctx.strokeStyle = offsetTarget === 'reflect' ? '#facc15' : 'RED';
            ctx.lineWidth = offsetTarget === 'reflect' ? 2.5 : 1.2;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'RED';
        }

        // --- H&A OPTICAL PHYSICS ENGINE ---
        const n = 2.417; // Diamond Refractive Index
        const beta = rad(config.crownAngle);  // Crown (bezel) angle
        const lgfRatio = config.lgfRatio;  // Lower Girdle Facet ratio (affects arrow "thinness")

        // 1. Arrowhead "V" Half-Angle via Snell's Law & Crown Refraction
        // The bezel facet is tilted by 'beta'. We calculate the apparent width of the 
        // pavilion main reflection as it refracts through the tilted crown facet.
        const internalHalfAngle = (1 - lgfRatio) * (Math.PI / 8); 
        // Snell's law for a tilted surface: n*sin(theta_in) = sin(theta_out)
        // The tilt (beta) compresses the apparent angle:
        const headHalfAngle = Math.asin(Math.min(1.0, n * Math.sin(internalHalfAngle) * (Math.sin(beta)*1.5)));
        
        //

        // 2. Performance/Clarity (TIR Failure)
        // Arrows are only "Ideal" black extinction when pavilion angles allow proper TIR.
        const pavDeviation = Math.abs(config.pavAngle - 40.75);
        const arrowClarity = Math.max(0.5, 0.8 - (pavDeviation * 0.35));

        for (let i = 0; i < 8; i++) {
            const theta = (i * Math.PI / 4) + (Math.PI / 8);
            ctx.save();
            ctx.rotate(theta);

            // Real-world arrow color (Deep obsidian extinction)
            const opacity = 0.98 * arrowClarity;
            ctx.fillStyle = `rgba(5, 8, 15, ${opacity})`;

            // Clip to Girdle: Ensure nothing draws outside the radius
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.clip();

            // --- DRAW SHAFT (Seen through Table) ---
            const shaftBaseWidth = tableRadius * (1.1 - lgfRatio) * 0.21;
            const shaftTipWidth = shaftBaseWidth * 4;

            ctx.beginPath();
            ctx.moveTo(rReflect+10, 0); // Tip at center
            ctx.lineTo(rReflect, shaftTipWidth / 2); // Flare start
            ctx.lineTo(tableRadius, shaftBaseWidth / 2); // Outer corner
            ctx.lineTo(tableRadius, -shaftBaseWidth / 2); // Outer corner (opposite)
            ctx.lineTo(rReflect, -shaftTipWidth / 2); // Flare start (opposite)
            ctx.closePath();
            ctx.fill();

            // --- DRAW ARROWHEAD (Seen through Bezel Facets) ---
            // Arrowhead length spans the bezel (Table edge to Girdle)
            const headBase = tableRadius;
            const headTip = radius + 8 + config.girdleThickPct*config.girdleThickPct/8; // Tip at girdle
            const headLength = headTip - headBase;
            const wingWidth = Math.tan(headHalfAngle) * headLength;

            ctx.beginPath();
            ctx.moveTo(headTip, 0); // Pointy Tip
            ctx.lineTo(headBase + headLength * 0.15, wingWidth); // Wing shoulder
            ctx.lineTo(headBase, shaftBaseWidth * 0.5); // Neck (meets shaft)
            const chevronDepth = headLength * 0; // V-notch depth
            ctx.lineTo(headBase + chevronDepth, 0); 
            ctx.lineTo(headBase, -shaftBaseWidth * 0.5);
            ctx.lineTo(headBase + headLength * 0.15, -wingWidth);
            ctx.closePath();
            

            // Add refraction edge
            ctx.strokeStyle = `rgba(255, 0, 0, ${0.95 * arrowClarity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        // Draw simple crosshair for center reference
        ctx.beginPath();
        ctx.moveTo(-5, 0); ctx.lineTo(5, 0);
        ctx.moveTo(0, -5); ctx.lineTo(0, 5);
        ctx.stroke();

        ctx.restore();
    }

    function renderThreePointUI(ctx, w, h) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform to draw in screen pixels
        
        // Instruction Text
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, h - 40, w, 40);
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const step = threePointState.points.length + 1;
        ctx.fillText(`Click point ${step} of 3 on the circle edge`, w / 2, h - 20);

        // Draw Points
        threePointState.points.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Draw line connecting
            if (i > 0) {
                ctx.beginPath();
                ctx.moveTo(threePointState.points[i-1].x, threePointState.points[i-1].y);
                ctx.lineTo(p.x, p.y);
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        });

        // Draw Loupe (Magnifier)
        if (threePointState.mouseX > 0) {
            const mx = threePointState.mouseX;
            const my = threePointState.mouseY;
            const zoom = 3;
            const r = 60;

            ctx.save();
            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.clip();

            // Draw background fill to hide non-magnified content behind loupe
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(mx - r, my - r, r * 2, r * 2);

            // Draw Magnified Image
            const viewName = threePointState.view;
            const ov = overlays[viewName];
            let source = null;
            if (ov.type === 'camera' && ov.elVid.style.display !== 'none') source = ov.elVid;
            else if (ov.type === 'image' && ov.elImg.style.display !== 'none') source = ov.elImg;

            if (source) {
                ctx.translate(mx, my);
                ctx.scale(zoom, zoom);
                ctx.translate(-mx, -my);
                drawTransformedImage(ctx, source, imageState[threePointState.view], w, h);
            }
            ctx.restore();

            // Loupe Border & Crosshair
            ctx.beginPath();
            ctx.arc(mx, my, r, 0, Math.PI * 2);
            ctx.strokeStyle = "white";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(mx - 10, my); ctx.lineTo(mx + 10, my);
            ctx.moveTo(mx, my - 10); ctx.lineTo(mx, my + 10);
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.restore();
    }

    // Helper to draw angle arcs
    function drawAngleArc(ctx, x, y, r, start, end, val) {
        ctx.beginPath();
        ctx.strokeStyle = '#38bdf8';
        const ccw = end < start;
        ctx.arc(x, y, r, start, end, ccw);
        ctx.stroke();
        
        ctx.fillStyle = '#38bdf8';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        // Simple offset placement
        const labelY = y + (ccw ? -12 : 12);
        ctx.fillText(val.toFixed(2) + '°', x + r + 5, labelY);
    }

    // Helper to draw schematic dimension lines
    function drawDimensionLine(ctx, x1, y1, x2, y2, text) {
        ctx.save();
        ctx.strokeStyle = '#64748b';
        ctx.fillStyle = '#64748b';
        ctx.lineWidth = 1;
        ctx.font = '10px sans-serif';
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        
        // Ticks
        ctx.beginPath();
        ctx.moveTo(x1 - 3, y1); ctx.lineTo(x1 + 3, y1);
        ctx.moveTo(x2 - 3, y2); ctx.lineTo(x2 + 3, y2);
        ctx.stroke();
        
        // Text
        const midY = (y1 + y2) / 2;
        ctx.textBaseline = 'middle';
        
        if (x1 > 0) {
            ctx.textAlign = 'left';
            ctx.fillText(text, x1 + 5, midY);
        } else {
            ctx.textAlign = 'right';
            ctx.fillText(text, x1 - 5, midY);
        }
        
        ctx.restore();
    }

    // --- Camera and Overlay Logic ---

    function isFrontDevice(d) {
        if (!d) return false;
        if (d.isVirtualFront) return true;
        const lbl = (d.label || '').toLowerCase();
        if (lbl.includes('front') || lbl.includes('user') || lbl.includes('selfie') || lbl.includes('forward')) return true;
        try {
            if (typeof d.getCapabilities === 'function') {
                const caps = d.getCapabilities();
                if (caps.facingMode && caps.facingMode.includes('user')) return true;
            }
        } catch(e) {}
        return false;
    }

    function isRearDevice(d) {
        if (!d) return false;
        if (d.isVirtualRear) return true;
        const lbl = (d.label || '').toLowerCase();
        if (lbl.includes('back') || lbl.includes('rear') || lbl.includes('environment')) return true;
        try {
            if (typeof d.getCapabilities === 'function') {
                const caps = d.getCapabilities();
                if (caps.facingMode && caps.facingMode.includes('environment')) return true;
            }
        } catch(e) {}
        return false;
    }

    function isCurrentCameraFront() {
        if (videoDevices.length > 0 && currentDeviceIndex >= 0 && currentDeviceIndex < videoDevices.length) {
            const dev = videoDevices[currentDeviceIndex];
            if (isFrontDevice(dev)) return true;
            if (isRearDevice(dev)) return false;
        }
        if (sharedStream && sharedStream.getVideoTracks().length > 0) {
            const track = sharedStream.getVideoTracks()[0];
            const s = typeof track.getSettings === 'function' ? track.getSettings() : {};
            if (s.facingMode === 'user') return true;
            if (s.facingMode === 'environment') return false;
        }
        return false;
    }

    async function populateVideoDevices(stream) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        try {
            let allDevs = await navigator.mediaDevices.enumerateDevices();
            let videoInputs = allDevs.filter(d => d.kind === 'videoinput');
            if (videoInputs.length === 0) return;

            let rear = videoInputs.filter(isRearDevice);
            let front = videoInputs.filter(isFrontDevice);
            let others = videoInputs.filter(d => !isRearDevice(d) && !isFrontDevice(d));

            // If front camera was not explicitly identified in device labels,
            // provide a fallback selfie entry so the user can always switch to it!
            if (front.length === 0) {
                front = [{ deviceId: '', label: 'Selfie Camera', isVirtualFront: true }];
            }

            if (rear.length > 0) {
                videoDevices = [...rear, ...others, ...front];
            } else if (others.length > 0) {
                videoDevices = [...others, ...front];
            } else {
                videoDevices = [
                    { deviceId: '', label: 'Rear Camera', isVirtualRear: true },
                    { deviceId: '', label: 'Selfie Camera', isVirtualFront: true }
                ];
            }

            // Deduplicate devices by deviceId (keep virtuals)
            const seen = new Set();
            videoDevices = videoDevices.filter(d => {
                if (d.deviceId) {
                    if (seen.has(d.deviceId)) return false;
                    seen.add(d.deviceId);
                }
                return true;
            });

            // Match current active track
            if (stream && stream.getVideoTracks().length > 0) {
                const track = stream.getVideoTracks()[0];
                const activeId = track.getSettings().deviceId;
                const idx = videoDevices.findIndex(d => d.deviceId && d.deviceId === activeId);
                if (idx >= 0) currentDeviceIndex = idx;
            }

            updateCameraUI();
        } catch(e) {
            console.warn("Camera enumeration failed", e);
        }
    }

    async function toggleCamera(viewName) {
        const ov = overlays[viewName];
        
        // Stop live tracking if active
        if (trackingState[viewName].active) {
            toggleLiveTracking(viewName);
        }

        if (ov.type === 'camera') {
            // STOP Camera for this view
            stopCameraForView(viewName);
        } else {
            // START Camera
            try {
                // Clear image if exists
                clearOverlay(viewName);
                
                let stream = null;
                // Reuse existing stream if available
                if (sharedStream && sharedStream.active) {
                    stream = sharedStream;
                } else {
                    digitalZoomLevel = 1;
                    
                    // Choose constraints based on currentDeviceIndex if previously selected
                    let constraints = { video: { facingMode: 'environment' } };
                    if (videoDevices.length > 0 && currentDeviceIndex >= 0 && currentDeviceIndex < videoDevices.length) {
                        const targetDev = videoDevices[currentDeviceIndex];
                        const isFront = isFrontDevice(targetDev);
                        if (targetDev.deviceId) {
                            constraints = { video: { deviceId: { exact: targetDev.deviceId } } };
                        } else {
                            constraints = { video: { facingMode: isFront ? 'user' : 'environment' } };
                        }
                    }

                    try {
                        stream = await navigator.mediaDevices.getUserMedia(constraints);
                    } catch(conErr) {
                        // Fallback to basic getUserMedia
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    }

                    // Enumerate all devices (rear cameras + selfie camera)
                    await populateVideoDevices(stream);
                }

                sharedStream = stream;
                ov.elVid.srcObject = sharedStream;
                ov.elVid.style.display = 'block';
                ov.type = 'camera';
                
                // Mirror if front camera
                const isFront = isCurrentCameraFront();
                ov.elVid.style.transform = isFront ? 'scaleX(-1)' : '';

                const shutterBtn = document.getElementById(`shutter-${viewName}`);
                shutterBtn.classList.add('active-cam');
                
                updateCamLabel(viewName);
                updateCameraUI();
                setTimeout(updateZoomControls, 500);
            } catch (err) {
                console.error("Error accessing camera:", err);
                
                if (err.message === "INSECURE_CONTEXT" || !window.isSecureContext) {
                    alert(`⚠️ CAMERA BLOCKED ON LAN IP\n\nBrowsers block camera access on LAN IPs by default.\n\nTO FIX ON SAMSUNG/CHROME:\n1. Copy this: http://${location.host}\n2. Go to: chrome://flags/#unsafely-treat-insecure-origin-as-secure\n3. Set to ENABLED and paste the address.\n4. Tap Relaunch.`);
                } else {
                    alert(`Camera Error: ${err.message}`);
                }
                sharedStream = null;
            }
        }
    }

    function stopCameraForView(viewName) {
        const ov = overlays[viewName];
        ov.elVid.srcObject = null;
        ov.elVid.style.display = 'none';
        ov.elVid.style.transform = '';
        ov.type = null;
        const shutterBtn = document.getElementById(`shutter-${viewName}`);
        shutterBtn.classList.remove('active-cam');
        updateCamLabel(viewName);

        // If no other view is using camera, stop stream
        if (overlays.profile.type !== 'camera' && overlays.plan.type !== 'camera' && sharedStream) {
            sharedStream.getTracks().forEach(t => t.stop());
            sharedStream = null;
            digitalZoomLevel = 1;
            updateZoomControls();
        }
    }

    function updateCamLabel(viewName) {
        const label = document.getElementById(`cam-label-${viewName}`);
        if (!label) return;
        const ov = overlays[viewName];
        if (ov.type === 'camera') {
            label.style.display = 'block';
            if (isCurrentCameraFront()) {
                label.textContent = '🤳 Selfie Camera';
                label.style.background = 'rgba(167, 139, 250, 0.6)';
            } else {
                label.textContent = '📷 Rear Camera';
                label.style.background = 'rgba(0,0,0,0.6)';
            }
        } else {
            label.style.display = 'none';
        }
    }

    async function switchCamera() {
        if (videoDevices.length <= 1) return;
        currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
        
        if (sharedStream) {
            sharedStream.getTracks().forEach(t => t.stop());
            sharedStream = null;
        }

        const activeViews = Object.keys(overlays).filter(v => overlays[v].type === 'camera');
        if (activeViews.length === 0) return;
        
        const targetDev = videoDevices[currentDeviceIndex];
        const isFront = isCurrentCameraFront();
        digitalZoomLevel = 1;

        try {
            let constraints;
            if (targetDev && targetDev.deviceId) {
                constraints = { video: { deviceId: { exact: targetDev.deviceId } } };
            } else {
                constraints = { video: { facingMode: isFront ? 'user' : 'environment' } };
            }

            try {
                sharedStream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch(devErr) {
                console.warn("Exact deviceId failed, falling back to facingMode", devErr);
                sharedStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: isFront ? 'user' : 'environment' }
                });
            }

            activeViews.forEach(v => {
                overlays[v].elVid.srcObject = sharedStream;
                overlays[v].elVid.style.transform = isFront ? 'scaleX(-1)' : '';
                updateCamLabel(v);
            });
            updateCameraUI();
            setTimeout(updateZoomControls, 500);
        } catch(e) {
            console.error("Error switching camera", e);
            alert("Could not switch camera: " + e.message);
        }
    }

    function updateCameraUI() {
        const isFront = isCurrentCameraFront();
        document.querySelectorAll('.btn-switch-cam').forEach(btn => {
            btn.style.display = videoDevices.length > 1 ? 'inline-block' : 'none';
            btn.title = `Switch Camera (${isFront ? 'Selfie' : 'Rear'})`;
        });
    }

    // Shutter button: toggle open camera - shoot/freeze
    function handleShutter(viewName) {
        const ov = overlays[viewName];
        if (ov.type !== 'camera') {
            // Activate camera if it's off or showing an image
            toggleCamera(viewName);
        } else {
            // Capture/Freeze if camera is already on
            toggleFreeze(viewName);
        }
    }

    function updateZoomControls() {
        const container = document.getElementById('cameraZoomContainer');
        if (!sharedStream || sharedStream.getVideoTracks().length === 0) {
            container.style.display = 'none';
            return;
        }
        const track = sharedStream.getVideoTracks()[0];
        const capabilities = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
        
        if (capabilities.zoom) {
            // Hardware (optical) zoom available
            const slider = document.getElementById('cameraZoom');
            slider.min = capabilities.zoom.min || 1;
            slider.max = capabilities.zoom.max || 10;
            slider.step = capabilities.zoom.step || 0.1;
            slider.value = track.getSettings().zoom || capabilities.zoom.min || 1;
            
            document.getElementById('val-cameraZoom').textContent = parseFloat(slider.value).toFixed(1) + 'x';
            container.style.display = 'flex';
            
            slider.oninput = (e) => {
                document.getElementById('val-cameraZoom').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
                track.applyConstraints({
                    advanced: [{zoom: parseFloat(e.target.value)}]
                }).catch(err => console.error("Zoom apply error", err));
            };
        } else {
            // No hardware zoom: enable digital zoom (especially useful for selfie cam)
            const slider = document.getElementById('cameraZoom');
            slider.min = 1;
            slider.max = 5;
            slider.step = 0.1;
            slider.value = digitalZoomLevel;
            
            document.getElementById('val-cameraZoom').textContent = digitalZoomLevel.toFixed(1) + 'x 🔍';
            container.style.display = 'flex';
            
            slider.oninput = (e) => {
                digitalZoomLevel = parseFloat(e.target.value);
                document.getElementById('val-cameraZoom').textContent = digitalZoomLevel.toFixed(1) + 'x 🔍';
                applyDigitalZoom();
            };
        }
    }

    function applyDigitalZoom() {
        // Apply digital zoom via CSS transform on all active camera video elements
        const isFront = isCurrentCameraFront();
        Object.keys(overlays).forEach(viewName => {
            const ov = overlays[viewName];
            if (ov.type === 'camera') {
                const mirrorScale = isFront ? -1 : 1;
                ov.elVid.style.transform = `scaleX(${mirrorScale}) scale(${digitalZoomLevel})`;
            }
        });
    }

        const file = event.target.files[0];
        if (!file) return;
        
        const ov = overlays[viewName];
        
        // Stop camera if running on this view
        if (ov.type === 'camera') toggleCamera(viewName);

        const reader = new FileReader();
        reader.onload = (e) => {

            ov.elImg.style.display = 'block';

    async function pasteFromClipboard(viewName) {
        try {
            if (!navigator.clipboard || !navigator.clipboard.read) {
                alert("Clipboard API not supported in your browser or insecure context. Try using Ctrl+V / Cmd+V instead.");
                return;
            }
            const clipboardItems = await navigator.clipboard.read();
            for (const clipboardItem of clipboardItems) {
                const imageTypes = clipboardItem.types.filter(type => type.startsWith('image/'));
                if (imageTypes.length === 0) continue;
                
                const blob = await clipboardItem.getType(imageTypes[0]);
                const ov = overlays[viewName];
                if (ov.type === 'camera') toggleCamera(viewName);
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    ov.elImg.src = e.target.result;
                    ov.elImg.style.display = 'block';
                    ov.type = 'image';
                };
                reader.readAsDataURL(blob);
                return;
            }
            alert("No image found in clipboard!");
        } catch (err) {
            console.error("Paste error", err);
            alert("Could not paste: " + err.message + "\nTry using Ctrl+V or Cmd+V directly.");
        }
    }

    // Global Paste handling targeting the active view
    let activeViewForPaste = 'profile'; 
    document.addEventListener('mouseover', (e) => {
        if (e.target.closest('#container-profile')) activeViewForPaste = 'profile';
        if (e.target.closest('#container-plan')) activeViewForPaste = 'plan';
    });

    window.addEventListener('paste', (e) => {
        if (!e.clipboardData) return;
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.startsWith('image/')) {
                e.preventDefault();
                const blob = items[i].getAsFile();
                const ov = overlays[activeViewForPaste];
                if (ov.type === 'camera') toggleCamera(activeViewForPaste);
                
                const reader = new FileReader();
                reader.onload = (ev) => {
                    ov.elImg.src = ev.target.result;
                    ov.elImg.style.display = 'block';
                    ov.type = 'image';
                };
                reader.readAsDataURL(blob);
                
                // Visual feedback
                const container = document.getElementById(`container-${activeViewForPaste}`);
                const oldShadow = container.style.boxShadow;
                container.style.boxShadow = 'inset 0 0 20px #38bdf8';
                setTimeout(() => container.style.boxShadow = oldShadow, 500);
